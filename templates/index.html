
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAG Document Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>RAG Document Chatbot</h1>
            <p>Your AI-powered document learning assistant</p>
        </header>

        <div class="chat-box" id="chatBox">

            <div class="message bot">
                Hello! Upload your study documents into
                the system and ask me questions.
            </div>

        </div>

        <div class="controls">

            <label for="mode">Answer Mode:</label>

            <select id="mode">
                <option value="with_rag">With RAG</option>
                <option value="without_rag">Without RAG</option>
            </select>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask something about your documents..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
